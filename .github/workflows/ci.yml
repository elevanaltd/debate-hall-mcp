name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path for docs-only changes
  check-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            FILES=$(git diff --name-only HEAD^ HEAD || echo "")
          fi

          # If no files changed (initial commit), run full tests
          if [ -z "$FILES" ]; then
            echo "docs_only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if all changes are docs-only
          DOCS_ONLY=true
          while IFS= read -r file; do
            # Runtime code that must trigger tests:
            # - src/ directory
            # - tests/ directory
            # - pyproject.toml
            # - .github/workflows/
            if [[ "$file" =~ ^src/ ]] || \
               [[ "$file" =~ ^tests/ ]] || \
               [[ "$file" =~ ^pyproject\.toml$ ]] || \
               [[ "$file" =~ ^\.github/workflows/ ]]; then
              DOCS_ONLY=false
              break
            fi

            # Documentation-only paths (safe to skip tests):
            # - docs/ directory
            # - .hestai/ directory
            # - Root-level markdown files (README.md, CHANGELOG.md, etc.)
            # - LICENSE files
            if [[ "$file" =~ ^docs/ ]] || \
               [[ "$file" =~ ^\.hestai/ ]] || \
               [[ "$file" =~ ^\w+\.(md|txt)$ ]] || \
               [[ "$file" =~ ^LICENSE ]]; then
              continue
            fi

            # Any other file triggers full tests
            DOCS_ONLY=false
            break
          done <<< "$FILES"

          echo "docs_only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          echo "Documentation-only changes: $DOCS_ONLY"

  quality:
    name: Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run ruff linting
        run: |
          source .venv/bin/activate
          ruff check src tests

      - name: Run black format check
        run: |
          source .venv/bin/activate
          black --check src tests

      - name: Run mypy type checking
        run: |
          source .venv/bin/activate
          mypy src

      - name: Run pytest with coverage
        run: |
          source .venv/bin/activate
          pytest --cov=debate_hall_mcp --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [check-changes, quality]
    if: needs.check-changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install build tools
        run: |
          uv pip install --system build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  artifact-validate:
    name: Validate Distribution Artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install wheel in clean environment
        run: |
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "import debate_hall_mcp; print(f'IMPORTED_FROM::{debate_hall_mcp.__file__}')"

      - name: Assert no test files in installed package
        run: |
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python - <<'PY'
          import pathlib
          import debate_hall_mcp
          pkg = pathlib.Path(debate_hall_mcp.__file__).resolve().parent
          test_files = list(pkg.rglob("test_*.py"))
          assert not test_files, f"test_files_found_in_wheel::{test_files}"
          PY

      - name: Assert no tests/ paths in wheel
        run: |
          unzip -l dist/*.whl | grep -E "tests/" && echo "ERROR::tests_paths_found_in_wheel" && exit 1 || echo "OK::no_tests_paths_in_wheel"

  integration-from-wheel:
    name: Integration Tests (from wheel)
    runs-on: ubuntu-latest
    needs: artifact-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install wheel with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install pytest pytest-asyncio

      - name: Test CLI commands
        run: |
          # Verify CLI is installed
          debate-hall-mcp --help || echo "CLI command registered"

      - name: Test MCP server startup
        run: |
          # Test server can start (MCP servers wait for stdio input)
          timeout 5s python -m debate_hall_mcp.server || true
          # Exit code 124 means timeout (server started but didn't exit)
          # This is expected for a server that waits for input

  final-gate:
    name: Final Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [check-changes, quality, build, artifact-validate, integration-from-wheel]

    steps:
      - name: Determine required checks
        id: required
        run: |
          DOCS_ONLY="${{ needs.check-changes.outputs.docs_only }}"

          echo "docs_only=$DOCS_ONLY"
          echo "quality_result=${{ needs.quality.result }}"
          echo "build_result=${{ needs.build.result }}"
          echo "artifact_validate_result=${{ needs.artifact-validate.result }}"
          echo "integration_from_wheel_result=${{ needs.integration-from-wheel.result }}"

      - name: Validate results
        run: |
          DOCS_ONLY="${{ needs.check-changes.outputs.docs_only }}"

          # For docs-only changes, skip code validation
          if [ "$DOCS_ONLY" == "true" ]; then
            echo "OK::docs_only_change::skipping_code_validation"
            exit 0
          fi

          # For code changes, all jobs must pass
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "ERROR::required_job_failed::quality::${{ needs.quality.result }}"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "ERROR::required_job_failed::build::${{ needs.build.result }}"
            exit 1
          fi

          if [ "${{ needs.artifact-validate.result }}" != "success" ]; then
            echo "ERROR::required_job_failed::artifact-validate::${{ needs.artifact-validate.result }}"
            exit 1
          fi

          if [ "${{ needs.integration-from-wheel.result }}" != "success" ]; then
            echo "ERROR::required_job_failed::integration-from-wheel::${{ needs.integration-from-wheel.result }}"
            exit 1
          fi

          echo "OK::final_gate_passed"
