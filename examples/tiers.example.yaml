# Debate Hall MCP - Advanced Tier Configuration Reference
#
# This file shows ADVANCED configurations beyond the basic template.
# For quick setup, use the simpler template at the project root:
#   cp tiers.yaml.example tiers.yaml
#
# The root template already includes: standard, fast, premium tiers
# This file demonstrates additional patterns:
# - CLI providers (claude, codex, gemini CLIs)
# - Mixed provider configurations
# - Custom prompts
# - Model selection with CLI args
#
# Copy specific sections to your tiers.yaml as needed.

# =============================================================================
# CLI PROVIDER EXAMPLES
# =============================================================================

# CLI tier - Uses external AI CLIs instead of OpenRouter API
# Requires: claude CLI, codex CLI, gemini CLI installed
cli-standard:
  wind:
    provider: cli
    cli: claude
    role: wind-agent
    timeout: 120
  wall:
    provider: cli
    cli: codex
    role: wall-agent
    timeout: 120
  door:
    provider: cli
    cli: gemini
    role: door-agent
    timeout: 120
  settings:
    consensus_required: true
    max_turns: 12
    max_refinement_loops: 3
    provider_timeout: 120
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-haiku-4
      timeout: 60

# CLI with specific model selection
# Demonstrates: model and cli_args configuration
cli-with-models:
  wind:
    provider: cli
    cli: claude
    model: claude-sonnet-4-20250514  # Specific model for claude CLI
    cli_args:
      verbose: true  # Pass --verbose flag
    timeout: 120
  wall:
    provider: cli
    cli: codex
    model: o3-mini  # Specific model for codex CLI
    timeout: 120
  door:
    provider: cli
    cli: gemini
    model: gemini-2.5-flash  # Specific model for gemini CLI
    timeout: 120
  settings:
    consensus_required: true
    max_turns: 12
    max_refinement_loops: 3
    provider_timeout: 120
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-haiku-4
      timeout: 60

# =============================================================================
# MIXED PROVIDER EXAMPLES
# =============================================================================

# Mixed tier - CLI for some roles, OpenRouter for others
# Useful when you have some CLIs installed but not all
mixed:
  wind:
    provider: cli
    cli: claude
    timeout: 120
  wall:
    provider: openrouter
    model: openai/gpt-4.1-mini
    timeout: 90
  door:
    provider: cli
    cli: gemini
    timeout: 120
  settings:
    consensus_required: true
    max_turns: 12
    max_refinement_loops: 3
    provider_timeout: 120
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-haiku-4
      timeout: 60

# =============================================================================
# CUSTOM PROMPT EXAMPLES
# =============================================================================

# Security tier - Uses custom security-focused prompts
# Custom prompts are resolved in order:
#   1. ./prompts/{role}-{name}.oct.md (project-local)
#   2. ~/.debate-hall/prompts/{role}-{name}.oct.md (user-global)
security:
  wind:
    provider: cli
    cli: claude
    prompt_file: security  # -> wind-security.oct.md
    timeout: 150
  wall:
    provider: cli
    cli: codex
    prompt_file: security  # -> wall-security.oct.md
    timeout: 150
  door:
    provider: cli
    cli: gemini
    prompt_file: security  # -> door-security.oct.md
    timeout: 150
  settings:
    consensus_required: true
    max_turns: 15
    max_refinement_loops: 4
    provider_timeout: 150
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-sonnet-4
      timeout: 90

# Custom prompt paths - absolute and relative
custom-prompts:
  wind:
    provider: openrouter
    model: anthropic/claude-opus-4
    prompt_file: /path/to/your/wind-custom.oct.md  # Absolute path
  wall:
    provider: openrouter
    model: openai/gpt-4.1
    prompt_file: ./local-wall-prompt.oct.md  # Relative to cwd
  door:
    provider: openrouter
    model: google/gemini-2.5-pro
    prompt_file: technical  # Named variant -> door-technical.oct.md
  settings:
    consensus_required: true
    max_turns: 12
    max_refinement_loops: 3
    provider_timeout: 120
    fallback:
      enabled: false
