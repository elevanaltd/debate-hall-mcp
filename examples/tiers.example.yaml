# Debate Hall MCP - Tier Configuration Example
#
# Copy this file to ~/.debate-hall/tiers.yaml to customize your debate configuration.
# Or set DEBATE_HALL_TIERS_FILE=/path/to/your/tiers.yaml
#
# Each tier defines:
# - wind: Configuration for Wind (PATHOS) - creative exploration
# - wall: Configuration for Wall (ETHOS) - constraint validation
# - door: Configuration for Door (LOGOS) - synthesis
# - settings: Debate behavior settings

# Standard tier using CLI providers (requires claude, codex, gemini CLIs installed)
standard:
  wind:
    provider: cli
    cli: claude
    role: wind-agent  # Optional: role for PAL MCP clink
  wall:
    provider: cli
    cli: codex
    role: wall-agent
  door:
    provider: cli
    cli: gemini
    role: door-agent
  settings:
    consensus_required: true   # Wind/Wall must approve Door's synthesis
    max_turns: 12              # Maximum total turns in debate
    max_refinement_loops: 3    # Max times Door can refine after rejection

# Premium tier using OpenRouter API (requires OPENROUTER_API_KEY env var)
premium:
  wind:
    provider: openrouter
    model: anthropic/claude-3-opus
  wall:
    provider: openrouter
    model: openai/gpt-4-turbo
  door:
    provider: openrouter
    model: google/gemini-pro
  settings:
    consensus_required: true
    max_turns: 20
    max_refinement_loops: 5

# Fast tier for quick iterations (smaller models, no consensus)
fast:
  wind:
    provider: openrouter
    model: anthropic/claude-3-haiku
  wall:
    provider: openrouter
    model: openai/gpt-3.5-turbo
  door:
    provider: openrouter
    model: google/gemini-pro
  settings:
    consensus_required: false  # Skip Wind/Wall approval step
    max_turns: 6
    max_refinement_loops: 1

# Mixed tier - CLI for some roles, OpenRouter for others
mixed:
  wind:
    provider: cli
    cli: claude
  wall:
    provider: openrouter
    model: openai/gpt-4-turbo
  door:
    provider: cli
    cli: gemini
  settings:
    consensus_required: true
    max_turns: 12
    max_refinement_loops: 3
