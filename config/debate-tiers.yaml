# Debate Hall — ready-to-use tier configuration
#
# This file ships with the repo as the reference tier config. `setup-mcp.sh`
# copies it to ~/.debate-hall/tiers.yaml (user-global) so run_debate works from
# ANY directory, including fresh `pip install debate-hall-mcp` setups. The only
# thing you must provide is an API key, exported in the shell you launch from:
#
#     export OPENROUTER_API_KEY=sk-or-...        # get one at https://openrouter.ai
#
# Then just ask Claude Code:  "run a debate on <your question>"  (or use /debate)
#
# Models below are OpenRouter slugs, verified 2026-09-25. If a run errors with
# "model not found", open https://openrouter.ai/models and swap in the current
# Opus / Gemini / GPT slug — nothing else needs to change.
#
# Role names are hyphenated (critical-engineer, technical-architect).
# Model heuristic (M019): Claude→Wind, GPT→Wall, Gemini→Door when practical.

# -----------------------------------------------------------------------------
# standard — three DIFFERENT frontier models genuinely debating each other.
# This is the default and what you want for "find me the genius solution".
# -----------------------------------------------------------------------------
standard:
  wind:                                   # explores / generates options
    provider: openrouter
    model: anthropic/claude-opus-5.5
    role: ideator
  wall:                                   # challenges / pressure-tests
    provider: openrouter
    model: openai/gpt-5.6-terra
    role: validator
  door:                                   # synthesises the third-way answer
    provider: openrouter
    model: google/gemini-3.1-pro-preview
    role: synthesizer
  settings:
    consensus_required: true
    max_turns: 12
    max_refinement_loops: 3
    provider_timeout: 300
    show_token_counts: true
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-sonnet-5
      timeout: 60

# -----------------------------------------------------------------------------
# fast — cheaper / quicker. Good for low-stakes or "just give me a quick take".
# Ask for it explicitly: "run a FAST debate on ..." (or /debate handles it).
# -----------------------------------------------------------------------------
fast:
  wind:
    provider: openrouter
    model: anthropic/claude-haiku-4.5
    role: wind-agent
    timeout: 60
  wall:
    provider: openrouter
    model: openai/gpt-6-luna
    role: wall-agent
    timeout: 60
  door:
    provider: openrouter
    model: google/gemini-3.8-flash
    role: door-agent
    timeout: 60
  settings:
    consensus_required: false
    max_turns: 6
    max_refinement_loops: 1
    provider_timeout: 60
    show_token_counts: true
    fallback:
      enabled: false

# -----------------------------------------------------------------------------
# system — specialist roles on the standard frontier trio.
# -----------------------------------------------------------------------------
system:
  wind:
    provider: openrouter
    model: anthropic/claude-opus-5.5
    role: edge-optimizer
  wall:
    provider: openrouter
    model: openai/gpt-5.6-terra
    role: critical-engineer
  door:
    provider: openrouter
    model: google/gemini-3.1-pro-preview
    role: technical-architect
  settings:
    consensus_required: true
    max_turns: 16
    max_refinement_loops: 5
    provider_timeout: 600
    show_token_counts: true
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-sonnet-5
      timeout: 120

# -----------------------------------------------------------------------------
# premium — Fable creative Wind + GPT Sol Wall + Gemini Pro Door.
# -----------------------------------------------------------------------------
premium:
  wind:
    provider: openrouter
    model: anthropic/claude-fable-5.1
    role: edge-optimizer
  wall:
    provider: openrouter
    model: openai/gpt-6-sol
    role: critical-engineer
  door:
    provider: openrouter
    model: google/gemini-3.1-pro-preview
    role: technical-architect
  settings:
    consensus_required: true
    max_turns: 16
    max_refinement_loops: 5
    provider_timeout: 600
    show_token_counts: true
    fallback:
      enabled: true
      provider: openrouter
      model: anthropic/claude-sonnet-5
      timeout: 120

# -----------------------------------------------------------------------------
# ultra — alternate-provider frontier (DeepSeek Pro GA / GPT Sol / GLM Prime).
# -----------------------------------------------------------------------------
ultra:
  wind:
    provider: openrouter
    model: deepseek/deepseek-v4-pro-0813
    role: edge-optimizer
  wall:
    provider: openrouter
    model: openai/gpt-6-sol
    role: critical-engineer
  door:
    provider: openrouter
    model: z-ai/glm-5.3-prime
    role: technical-architect
  settings:
    consensus_required: true
    max_turns: 16
    max_refinement_loops: 5
    provider_timeout: 600
    show_token_counts: true
    fallback:
      enabled: true
      provider: openrouter
      model: deepseek/deepseek-v4-pro-0813
      timeout: 120
